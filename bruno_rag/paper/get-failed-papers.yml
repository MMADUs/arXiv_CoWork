info:
  name: get-failed-papers
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/papers?output=full&status=failed&limit=50&offset=0"
  params:
    - name: output
      value: full
      type: query
    - name: status
      value: failed
      type: query
    - name: limit
      value: "50"
      type: query
    - name: offset
      value: "0"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
