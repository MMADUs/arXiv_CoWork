info:
  name: download-paper-pdf-by-id
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/papers/{paper_id}/download-pdf"
  body:
    type: json
    data: |-
      {
        "force_download": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
