info:
  name: ingest-paper-metadata
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/papers/ingest"
  body:
    type: json
    data: |-
      {
        "keywords": [
          "agentic reinforcement learning",
          "LLM agents",
          "autonomous agents",
          "multi-agent reinforcement learning"
        ],
        "title": null,
        "abstract": null,
        "authors": null,
        "categories": ["cs.AI", "cs.LG", "cs.MA"],
        "exclude_categories": null,
        "ids": null,
        "submitted_from": null,
        "submitted_to": null,
        "max_results": 50,
        "start": 0,
        "sort_by": "submittedDate",
        "sort_order": "descending",
        "download_pdf": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
