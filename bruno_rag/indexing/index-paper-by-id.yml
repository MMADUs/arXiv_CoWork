info:
  name: index-paper-by-id
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/papers/{paper_id}/index"
  body:
    type: json
    data: |-
      {
        "force_parse": false,
        "force_chunk": false,
        "force_reindex": false,
        "include_failed_chunks": false,
        "batch_size": 50
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
